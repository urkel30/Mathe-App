<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mathe-Abenteuer – 3. Klasse</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef1ff,#fff8ed);color:#20243a}.app{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:25px;font-weight:900}.logo span{color:#5b5ce2}.pills{display:flex;gap:8px}.pill{background:#fff;padding:9px 13px;border-radius:18px;font-weight:800;box-shadow:0 8px 25px #20243a18}.hero,.panel{background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 25px #20243a18}.hero{background:linear-gradient(135deg,#5b5ce2,#8586f5);color:white;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:31px}.hero p{margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}button{font:inherit;border:0;cursor:pointer}.card{background:#fff;border-radius:22px;padding:18px;text-align:left;min-height:135px;box-shadow:0 8px 25px #20243a18}.card:active,.ans:active{transform:scale(.98)}.icon{font-size:34px}.card h3{margin:7px 0 3px}.card p,.small{margin:0;color:#69708a;font-size:14px}.challenge{margin-top:15px;background:#fff4d8;border-radius:22px;padding:18px}.mainbtn,.back{border-radius:17px;padding:14px;font-weight:900}.mainbtn{width:100%;background:#5b5ce2;color:#fff;margin-top:10px}.back{background:#eef0ff;color:#5b5ce2;margin-bottom:14px}.q{font-size:36px;font-weight:900;text-align:center;margin:25px 0;white-space:pre-line}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{background:#f0f1ff;border-radius:20px;padding:18px;font-size:24px;font-weight:900}.correct{background:#e7faef!important;outline:3px solid #20a66a}.wrong{background:#fff0f0!important;outline:3px solid #e25353}.feedback{text-align:center;min-height:45px;padding:12px;font-weight:800}.bar{height:9px;background:#e6e7ef;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#5b5ce2;transition:.3s}.result{text-align:center}.big{font-size:60px}
</style></head><body><div class="app" id="app"></div>
<script>
const topics=[
["add","➕","Addition","Rechnen bis 1.000"],["sub","➖","Subtraktion","Rechnen bis 1.000"],["mul","✖️","Einmaleins","Malaufgaben trainieren"],["div","➗","Division","Geteilt-Aufgaben"],["money","💶","Geld","Euro & Cent"],["time","🕐","Uhrzeit","Uhr lesen & Zeiten"],["measure","📏","Größen","Länge & Gewicht"],["geo","🔷","Geometrie","Formen & Umfang"],["word","📖","Sachaufgaben","Rechnen mit Geschichten"]];
let s=JSON.parse(localStorage.getItem("mathe3")||'{"points":0,"stars":0}'),game=null;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, sh=a=>a.sort(()=>Math.random()-.5);
function opts(c,make){let x=new Set([String(c)]);while(x.size<4)x.add(String(make()));return sh([...x])}
function q(t){
let a,b,c,text,o;
if(t=="add"){a=rnd(20,699);b=rnd(10,999-a);c=a+b;text=`${a} + ${b} = ?`;o=opts(c,()=>c+rnd(-30,30))}
if(t=="sub"){a=rnd(100,999);b=rnd(10,a);c=a-b;text=`${a} − ${b} = ?`;o=opts(c,()=>Math.max(0,c+rnd(-30,30)))}
if(t=="mul"){a=rnd(2,10);b=rnd(2,10);c=a*b;text=`${a} × ${b} = ?`;o=opts(c,()=>rnd(2,10)*a)}
if(t=="div"){b=rnd(2,10);c=rnd(2,10);a=b*c;text=`${a} ÷ ${b} = ?`;o=opts(c,()=>rnd(1,10))}
if(t=="money"){a=rnd(2,30);b=rnd(0,99);c=(a+b/100).toFixed(2).replace(".",",")+" €";text=`Ein Spielzeug kostet ${a} € und ${b} Cent. Wie viel kostet es?`;o=opts(c,()=>((Math.max(.01,a+b/100+rnd(-300,300)/100))).toFixed(2).replace(".",",")+" €")}
if(t=="time"){let h=rnd(7,18),m=[0,15,30,45][rnd(0,3)];c=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} Uhr`;text=`Welche Uhrzeit ist das?
${h}:${String(m).padStart(2,"0")}`;o=opts(c,()=>`${String(rnd(7,18)).padStart(2,"0")}:${String([0,15,30,45][rnd(0,3)]).padStart(2,"0")} Uhr`)}
if(t=="measure"){a=rnd(100,900);c=(a/100).toFixed(2).replace(".",",")+" m";text=`Wie viele Meter sind ${a} cm?`;o=opts(c,()=>`${rnd(1,9)},${rnd(0,9)} m`)}
if(t=="geo"){a=rnd(3,15);b=rnd(3,15);c=2*a+2*b;text=`Ein Rechteck ist ${a} cm lang und ${b} cm breit. Wie groß ist der Umfang?`;o=opts(c,()=>Math.max(1,c+rnd(-8,8)))}
if(t=="word"){a=rnd(3,12);b=rnd(3,12);c=a*b;text=`In ${a} Kisten liegen jeweils ${b} Äpfel. Wie viele Äpfel sind es?`;o=opts(c,()=>a*rnd(2,12))}
return{text,c:String(c),o}}
function save(){localStorage.setItem("mathe3",JSON.stringify(s))}
function home(){app.innerHTML=`<div class="top"><div class="logo">🧠 <span>Mathe-Abenteuer</span></div><div class="pills"><div class="pill">⭐ ${s.stars}</div><div class="pill">🏆 ${s.points}</div></div></div><div class="hero"><h1>Bereit für Mathe? 🚀</h1><p>Übe spielerisch die wichtigsten Themen der 3. Klasse.</p></div><div class="grid">${topics.map(t=>`<button class="card" onclick="start('${t[0]}')"><div class="icon">${t[1]}</div><h3>${t[2]}</h3><p>${t[3]}</p></button>`).join("")}</div><div class="challenge"><b>⭐ Tages-Challenge</b><p>10 gemischte Aufgaben – schaffst du alle?</p><button class="mainbtn" onclick="start('challenge')">Challenge starten</button></div><p class="small" style="text-align:center;margin-top:16px">Der Fortschritt wird auf diesem Gerät gespeichert.</p>`}
function start(t){game={t,i:0,right:0};next()}
function next(){let t=game.t=="challenge"?topics[rnd(0,topics.length-1)][0]:game.t;game.q=q(t);app.innerHTML=`<div class="panel"><button class="back" onclick="home()">← Zurück</button><div style="display:flex;justify-content:space-between"><b>${game.t=="challenge"?"⭐ Tages-Challenge":topics.find(x=>x[0]==t)[2]}</b><span>${game.i+1}/10</span></div><div class="bar" style="margin-top:9px"><div style="width:${game.i*10}%"></div></div><div class="q">${game.q.text}</div><div class="answers">${game.q.o.map((x,i)=>`<button class="ans" onclick="answer(${i})">${x}</button>`).join("")}</div><div id="fb" class="feedback"></div></div>`}
function answer(i){let q=game.q,bs=[...document.querySelectorAll(".ans")],ok=bs[i].textContent===q.c;bs.forEach(x=>x.disabled=true);bs[i].classList.add(ok?"correct":"wrong");if(!ok){let j=q.o.findIndex(x=>x===q.c);if(j>=0)bs[j].classList.add("correct")}document.getElementById("fb").textContent=ok?"🎉 Super! Richtig!":"💡 Noch nicht – die grüne Antwort ist richtig.";if(ok){game.right++;s.points+=10;s.stars++}save();setTimeout(()=>{game.i++;game.i>=10?finish():next()},800)}
function finish(){let st=game.right>=9?3:game.right>=7?2:game.right>=5?1:0;s.stars+=st;save();app.innerHTML=`<div class="panel result"><div class="big">${game.right>=7?"🏆":"💪"}</div><h1>Geschafft!</h1><p>Du hast <b>${game.right} von 10</b> Aufgaben richtig.</p><p style="font-size:28px">⭐ +${st} Sterne</p><button class="mainbtn" onclick="start('${game.t}')">Nochmal spielen</button><button class="mainbtn" style="background:#eef0ff;color:#5b5ce2" onclick="home()">Zur Übersicht</button></div>`}
home();
</script></body></html>
